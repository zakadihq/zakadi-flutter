# Zakadi repository standard: ci.yml for the Flutter repository. The zakadi_sdk packages
# and the example form a pub workspace; packages/zakadi keeps its own resolution (D76),
# so it is resolved on its own before the tree-wide format and analysis. The commands are
# the ones in lefthook.yml. The lint job ends with the scan of each resolution (CI only,
# references/GITHUB.md of the standard): very_good_cli reports the licence of every locked
# dependency against the excluded list of spec 00 0.10, then osv-scanner reads the same
# pubspec.lock. The integration job runs the zakadi publish dry run; the Kotlin unit
# tests of zakadi_sdk_android, then the example's integration test on an Android
# emulator; and on macOS the example's iOS simulator build and the XCTest cases of
# zakadi_sdk_ios, on Flutter 3.44 and the latest stable, with Swift Package Manager and
# CocoaPods.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart pub get -C packages/zakadi
      - run: dart format --output=none --set-exit-if-changed .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart pub get -C packages/zakadi
      - run: dart analyze --fatal-infos
      - run: bash tool/pigeons.sh && git diff --exit-code
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: .github/workflows/ci.yml
      - name: scan (workspace)
        shell: bash
        env:
          EXCLUDED_LICENCES: '(^|[^[:alnum:]])(A?GPL|SSPL|RSAL)|GNU (Affero )?General Public|Server Side Public|Redis Source Available|-NC([^[:alnum:]]|$)|[Nn]on[- ]?[Cc]ommercial|FoxIO'
        run: |
          dart pub global activate very_good_cli 1.4.0
          dart pub global run very_good_cli:very_good packages check licenses --dependency-type=direct-main,transitive --reporter=csv | tee "$RUNNER_TEMP/licences.txt"
          if grep -E "$EXCLUDED_LICENCES" "$RUNNER_TEMP/licences.txt"; then
            echo "scan: a licence excluded by spec 00 0.10 is listed above" >&2
            exit 1
          fi
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source --lockfile pubspec.lock
      - name: scan (zakadi)
        working-directory: packages/zakadi
        shell: bash
        env:
          EXCLUDED_LICENCES: '(^|[^[:alnum:]])(A?GPL|SSPL|RSAL)|GNU (Affero )?General Public|Server Side Public|Redis Source Available|-NC([^[:alnum:]]|$)|[Nn]on[- ]?[Cc]ommercial|FoxIO'
        run: |
          dart pub global activate very_good_cli 1.4.0
          dart pub global run very_good_cli:very_good packages check licenses --dependency-type=direct-main,transitive --reporter=csv | tee "$RUNNER_TEMP/licences.txt"
          if grep -E "$EXCLUDED_LICENCES" "$RUNNER_TEMP/licences.txt"; then
            echo "scan: a licence excluded by spec 00 0.10 is listed above" >&2
            exit 1
          fi
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source --lockfile pubspec.lock

  unit:
    name: unit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: zakadi
            test: dart pub get && dart test
          - package: zakadi_sdk
            test: flutter test
          - package: zakadi_sdk_platform_interface
            test: flutter test
          - package: zakadi_sdk_android
            test: flutter test
          - package: zakadi_sdk_ios
            test: flutter test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: ${{ matrix.test }}
        working-directory: packages/${{ matrix.package }}

  integration:
    name: integration (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: zakadi publish dry run
            kind: publish
            os: ubuntu-latest
            flutter: any
          - leg: android emulator
            kind: android
            os: ubuntu-latest
            flutter: any
          - leg: ios 3.44 swiftpm
            kind: ios
            os: macos-latest
            flutter: 3.44.x
            spm: true
          - leg: ios 3.44 cocoapods
            kind: ios
            os: macos-latest
            flutter: 3.44.x
            spm: false
          - leg: ios stable swiftpm
            kind: ios
            os: macos-latest
            flutter: any
            spm: true
          - leg: ios stable cocoapods
            kind: ios
            os: macos-latest
            flutter: any
            spm: false
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for the emulator
        if: matrix.kind == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        if: matrix.kind == 'android'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Publish dry run of zakadi, in its own resolution
        if: matrix.kind == 'publish'
        working-directory: packages/zakadi
        run: dart pub get && dart pub publish --dry-run
      - name: Kotlin unit tests of zakadi_sdk_android
        if: matrix.kind == 'android'
        working-directory: packages/zakadi_sdk/example
        # --config-only writes the example's ignored Gradle wrapper and builds no artifact.
        # The tests run before the emulator starts, so an emulator failure cannot hide them.
        run: flutter build apk --config-only && cd android && ./gradlew :zakadi_sdk_android:testDebugUnitTest
      - name: Integration test of the example on an Android emulator
        if: matrix.kind == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd packages/zakadi_sdk/example && flutter test integration_test
      - name: Use CocoaPods instead of Swift Package Manager
        if: matrix.kind == 'ios' && !matrix.spm
        run: flutter config --no-enable-swift-package-manager
      - name: Build the example for the iOS simulator with Swift Package Manager
        if: matrix.kind == 'ios' && matrix.spm
        working-directory: packages/zakadi_sdk/example
        env:
          LANG: en_US.UTF-8
        run: flutter build ios --simulator --no-codesign
      - name: Build the example for the iOS simulator with CocoaPods
        if: matrix.kind == 'ios' && !matrix.spm
        working-directory: packages/zakadi_sdk/example
        env:
          LANG: en_US.UTF-8
          # Xcode 27 builds for iOS 15.0 and later only, and the Flutter pod that
          # Flutter 3.44 generates declares iOS 13.0. flutter hands FLUTTER_XCODE_* to
          # xcodebuild as build settings, so every target, the pods included, builds for
          # 15.0, the plugin's own floor (spec 08 8.1).
          FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: flutter build ios --simulator --no-codesign
      - name: XCTest cases of zakadi_sdk_ios with Swift Package Manager
        if: matrix.kind == 'ios' && matrix.spm
        working-directory: packages/zakadi_sdk/example/ios
        run: |
          udid=$(xcrun simctl list --json devices available | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination "id=$udid"
      - name: XCTest cases of zakadi_sdk_ios with CocoaPods
        if: matrix.kind == 'ios' && !matrix.spm
        working-directory: packages/zakadi_sdk/example/ios
        # The build setting does for xcodebuild what FLUTTER_XCODE_IPHONEOS_DEPLOYMENT_TARGET
        # does for flutter in the build above.
        run: |
          udid=$(xcrun simctl list --json devices available | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination "id=$udid" IPHONEOS_DEPLOYMENT_TARGET=15.0
