# Zakadi repository standard: git hooks (lefthook 2.x) for the Flutter repository.
# The commands are the ones .github/workflows/ci.yml runs. Install: brew install lefthook,
# then lefthook install. The zakadi_sdk packages and the example form a pub workspace;
# packages/zakadi keeps its own resolution (D76), so the format job resolves both before
# the checks, which run in order.

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: secrets
      glob: "{.env*,**/.env*}"
      run: 'echo "secrets: {staged_files} must not be committed (spec 00 0.11)" >&2; exit 1'
    - name: checks
      group:
        jobs:
          - name: format
            glob: "*.dart"
            run: dart pub get && dart pub get -C packages/zakadi && dart format --output=none --set-exit-if-changed {staged_files}
          - name: lint
            glob: "*.dart"
            run: dart analyze --fatal-infos
          - name: pigeons
            glob: "packages/zakadi_sdk_{android,ios}/**"
            # Only the generated files: unstaged edits elsewhere are not this check's business.
            run: bash tool/pigeons.sh && git diff --exit-code -- '*.g.dart' '*.g.kt' '*.g.swift'

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    - name: unit
      run: |
        (cd packages/zakadi && dart pub get && dart test) || exit 1
        for p in zakadi_sdk zakadi_sdk_platform_interface zakadi_sdk_android zakadi_sdk_ios; do
          (cd "packages/$p" && flutter test) || exit 1
        done
