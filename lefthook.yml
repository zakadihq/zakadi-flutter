# Zakadi repository standard: git hooks (lefthook 2.x) for the Flutter repository.
# The commands are the ones .github/workflows/ci.yml runs. Install: brew install lefthook,
# then lefthook install. One pure Dart package today (packages/zakadi); the federated
# plugin packages join the same jobs when they exist.

pre-commit:
  jobs:
    - name: ascii
      run: '! LC_ALL=C grep -nHI "[^[:print:][:space:]]" {staged_files}'
    - name: checks
      group:
        parallel: true
        jobs:
          - name: format
            glob: "*.dart"
            run: dart format --output=none --set-exit-if-changed {staged_files}
          - name: lint
            glob: "*.dart"
            run: dart pub get -C packages/zakadi && dart analyze --fatal-infos packages/zakadi

commit-msg:
  # git writes the message on merge and rebase.
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      run: |
        f="{1}"
        if LC_ALL=C grep -nH "[^[:print:][:space:]]" "$f"; then
          echo "commit message: ASCII only" >&2; exit 1
        fi
        if grep -iEq "^(co-authored-by|claude-session|generated-by):|claude\.ai/code|generated by" "$f"; then
          echo "commit message: no attribution trailer or footer" >&2; exit 1
        fi
        if [ "$(head -n 1 "$f" | wc -c)" -gt 73 ]; then
          echo "commit message: subject over 72 characters" >&2; exit 1
        fi

pre-push:
  jobs:
    - name: unit
      run: cd packages/zakadi && dart test
